services:
  app:
    profiles: [run]
    image: "${IMAGE_NAME}:${IMAGE_TAG}"
    build:
      dockerfile: Dockerfile
      args:
      - ENVIRONMENT
      - APP_NAME
      - APP_VERSION
      - COMMIT_SHA
      tags:
      - "${IMAGE_NAME}:${IMAGE_TAG_ALIAS}"
    ports:
    - "127.0.0.1:8000:8000"
    env_file: .env.run-docker
    develop:
      watch:
      - action: sync+restart
        path: ./app
        target: /code/app
      - action: rebuild
        path: uv.lock
    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  db:
    profiles: [run]
    image: pgvector/pgvector:0.8.0-pg17-trixie
    environment:
    - POSTGRES_USER=entitycore
    - POSTGRES_PASSWORD=entitycore
    ports:
    - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 2s
    restart: unless-stopped
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./data:/data
    command:
    - postgres
#    - -clog_statement=all
    - -clog_min_duration_statement=100ms
    - -clog_lock_waits=on

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: entitycore
      RUSTFS_SECRET_KEY: entitycore
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: :9001
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

  # One-off job creating the local buckets; names must match the defaults in app/config.py
  rustfs-init:
    image: amazon/aws-cli:2.37.6
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: entitycore
      AWS_SECRET_ACCESS_KEY: entitycore
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_DEFAULT_REGION: us-east-1
    restart: "no"
    entrypoint: sh
    command:
    - -ec
    - |
      for bucket in entitycore-data-dev openbluebrain; do
        aws s3api head-bucket --bucket "$$bucket" 2>/dev/null || aws s3api create-bucket --bucket "$$bucket"
      done
      aws s3api put-bucket-versioning --bucket entitycore-data-dev \
        --versioning-configuration Status=Enabled
      aws s3api put-bucket-policy --bucket openbluebrain --policy '{
        "Version": "2012-10-17",
        "Statement": [
          {"Effect": "Allow", "Principal": "*", "Action": "s3:GetObject", "Resource": "arn:aws:s3:::openbluebrain/*"},
          {"Effect": "Allow", "Principal": "*", "Action": "s3:ListBucket", "Resource": "arn:aws:s3:::openbluebrain"}
        ]
      }'
      echo "Buckets ready"

volumes:
  pgdata: {}
  rustfsdata: {}
